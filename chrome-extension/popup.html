<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #0f1830;         /* deep navy */
        --bg-elev: #152042;    /* slightly lighter panel */
        --fg: #ffffff;         /* primary text */
        --muted: #aab4cf;      /* secondary text */
        --accent: #2f6bff;     /* action */
        --accent-hover: #2558d1;
        --input-bg: #0e1730;
        --input-border: #31406c;
      }
      html, body { padding: 0; margin: 0; }
      body { font-family: Inter, -apple-system, system-ui, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif; font-size: 13px; background: var(--bg); color: var(--fg); width: 340px; }
      h3 { margin: 12px; font-weight: 600; }
      .row { margin: 8px 12px; }
      label { display: inline-block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
      input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--fg); outline: none; }
      input:disabled { opacity: 0.7; cursor: not-allowed; }
      button { padding: 8px 12px; margin-right: 6px; border-radius: 8px; border: 1px solid transparent; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
      button:hover { background: var(--accent-hover); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #log { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; margin: 10px 12px 12px; color: var(--muted); background: var(--bg-elev); padding: 8px; border-radius: 8px; border: 1px solid var(--input-border); }
    </style>
  </head>
  <body>
    <h3>Fantasy Snipe</h3>

    <div class="row"><strong>Login to API:</strong></div>
    <div class="row">
      <label>Email</label><br/>
      <input id="email" style="width:100%" placeholder="you@example.com" />
    </div>
    <div class="row">
      <label>Password</label><br/>
      <input id="password" type="password" style="width:100%" placeholder="••••••••" />
    </div>
    <div class="row">
      <button id="login">Login</button>
    </div>

    <div class="row"><strong>Sync</strong></div>
    <div class="row" style="display:none">
      <label>API URL</label><br/>
      <input id="apiUrl" style="width:100%" placeholder="https://your.api.host/api/inseason/cbs/import" />
    </div>
    <div class="row" style="display:none">
      <label>API Key</label><br/>
      <input id="apiKey" style="width:100%" placeholder="stored after login" />
    </div>
    <div class="row">
      <button id="syncBtn">Sync Now</button>
    </div>

    <div class="row">
      <label><input id="skipStats" type="checkbox" /> Skip Projections (/stats) this run</label>
    </div>

    <div class="row"><strong>Manual export (for debugging):</strong></div>
    <div class="row">
      <button id="thisJson">Export This (JSON)</button>
      <button id="allJson">Export All (JSON)</button>
      <button id="uploadCurrent">Upload This Page</button>
    </div>

    <div id="log"></div>

    <script src="popup.js"></script>
  </body>
</html>
