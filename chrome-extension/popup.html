<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; margin: 12px; width: 320px; }
      .row { margin-bottom: 8px; }
      button { padding: 6px 10px; margin-right: 6px; }
      #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; margin-top: 8px; color: #555; }
    </style>
  </head>
  <body>
    <h3>FirstOfficer CBS Export</h3>

    <div class="row"><strong>Login to API:</strong></div>
    <div class="row">
      <label>Email</label><br/>
      <input id="email" style="width:100%" placeholder="you@example.com" />
    </div>
    <div class="row">
      <label>Password</label><br/>
      <input id="password" type="password" style="width:100%" placeholder="••••••••" />
    </div>
    <div class="row">
      <button id="login">Login</button>
      <button id="register">Register</button>
    </div>

    <div class="row"><strong>Sync</strong></div>
    <div class="row">
      <label>API URL</label><br/>
      <input id="apiUrl" style="width:100%" placeholder="https://your.api.host/api/inseason/cbs/import" />
    </div>
    <div class="row">
      <label>API Key</label><br/>
      <input id="apiKey" style="width:100%" placeholder="stored after login" />
    </div>
    <div class="row">
      <button id="syncBtn">Sync Now</button>
    </div>

    <div id="log"></div>

    <script src="popup.js"></script>
  </body>
</html>
